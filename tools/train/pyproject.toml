[project]
name = "cybersend-train"
version = "0.1.0"
description = "CyberSend hold detector training pipeline (Phase 0 spike, Apache-2.0 stack only)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "rfdetr[train,onnx]>=1.11.2,<2.0.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
hold-download = "hold_train.dataset_download:main"
hold-convert = "hold_train.labelme_to_coco:main"
hold-split = "hold_train.split_dataset:main"
hold-build = "hold_train.build_dataset:main"
hold-bake = "hold_train.bake_dataset:main"
hold-train-smoke = "hold_train.train_smoke:main"
hold-train-d1 = "hold_train.train_d1:main"
hold-export = "hold_train.export_onnx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hold_train"]

[tool.hatch.build.targets.sdist]
exclude = ["datasets", "artifacts", ".venv"]
